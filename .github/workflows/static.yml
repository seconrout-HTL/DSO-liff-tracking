# Hardened workflow for deploying static web assets to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["seconrout-HTL-patch-2"]
  workflow_dispatch:

# Deny all permissions at workflow level (Least Privilege)
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Stage public web assets only
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css security.js config.js data.js ui.js dashboard.js app.js _site/
          cp -R assets _site/assets

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
