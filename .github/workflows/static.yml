# Hardened workflow for deploying static web assets to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["seconrout-HTL-patch-2"]
  workflow_dispatch:

# Deny all permissions at workflow level (Least Privilege)
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Separate build job avoids the single-job artifact visibility race (actions/deploy-pages#451)
  # and ensures re-running a failed deploy job never uploads a duplicate `github-pages` artifact.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage public web assets only
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css security.js config.js i18n.js data.js ui.js dashboard.js app.js _site/
          cp -R assets _site/assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Wait for artifact propagation on transient lookup miss
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Retry Deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
